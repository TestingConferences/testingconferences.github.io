---
layout: default
---
<div class="home">
  <div class="conference-search">
    <label class="visually-hidden" for="current-conference-search">Search upcoming conferences</label>
    <input
      id="current-conference-search"
      class="conference-search__input"
      type="search"
      placeholder="Search upcoming conferences"
      aria-controls="current-conference-list"
      data-conference-search-input>
    <p class="conference-search__results" data-conference-search-results aria-live="polite"></p>
    <p class="conference-search__empty" data-conference-search-empty hidden>No upcoming conferences matched your search.</p>
  </div>

  <ul class="post-list conference-list" id="current-conference-list" data-conference-search-list>
    {% for current in site.data.current %}
      <li>
        <h2><a href="{{current.url}}">{{ current.name }}</a></h2>
        <p>
          <i class="fa fa-calendar" role="img" aria-label="Dates" title="Dates"></i> {{ current.dates }} 
          <i class="fa fa-map-marker" role="img" aria-label="Location" title="Location"></i> {{ current.location }}
          {% if current.status != nil %}<i class="fa fa-bell" role="img" aria-label="Status" title="Status"></i> {{current.status}}{% endif %}
      </li>
    {% endfor %}
  </ul>
</div>
<script src="{{ "/assets/conference-search.js" | prepend: site.baseurl }}"></script>
