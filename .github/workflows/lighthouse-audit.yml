name: Lighthouse Audit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to audit (leave empty to use latest)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CLI
        run: npm install -g lighthouse

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Start local server
        run: |
          cd _site
          python3 -m http.server 4000 > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 3
          echo "Server started with PID $(cat /tmp/server.pid)"

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4000/ > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "Server failed to start"
          cat /tmp/server.log
          exit 1

      - name: Determine version
        id: version
        run: |
          # If manual dispatch input provided, use it
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Extract version from git tag (e.g., v1631 -> 1631)
            VERSION=$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//')
            if [ -z "$VERSION" ]; then
              # Fallback to VERSION.txt
              VERSION=$(cat _includes/VERSION.txt)
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version to audit: $VERSION"

      - name: Run Lighthouse audit
        run: |
          ruby tools/lighthouse_audit.rb \
            --version "${{ steps.version.outputs.version }}" \
            --site-url http://localhost:4000

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi

      - name: Commit quality metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/quality_log.yml
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: record Lighthouse metrics for v${{ steps.version.outputs.version }} [skip-version]"
            git push
          fi
